<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locket for Two</title>
  <meta name="description" content="A private little space for the two of you — milestones, love letters, your map and more." />

  <!-- Smart App Banner — shows "Open in App Store" bar on iOS Safari -->
  <meta name="apple-itunes-app" content="app-id=6775300058" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF6E3;
      color: #2A211A;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFBF2;
      border-radius: 28px;
      padding: 40px 28px 36px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(42,33,26,0.10);
    }
    .icon { font-size: 56px; line-height: 1; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.5; color: rgba(42,33,26,0.7); margin-bottom: 28px; }
    .btn {
      display: block;
      background: #2A211A;
      color: #FFF6E3;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 16px;
    }
    .links { margin-top: 24px; font-size: 13px; }
    .links a { color: rgba(42,33,26,0.55); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💛</div>
    <h1>Locket for Two</h1>
    <p>A private little space for the two of you — milestones, love letters, your map and more.</p>
    <a href="https://apps.apple.com/app/id6775300058" class="btn">Download on the App Store</a>
    <div class="links">
      <a href="/privacy-policy/">Privacy</a>
      <a href="/terms-of-service/">Terms</a>
    </div>
  </div>
</body>
</html>
